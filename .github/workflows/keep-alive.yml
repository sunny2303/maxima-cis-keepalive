name: Keep Maxima apps awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i playwright
      - run: npx playwright install --with-deps chromium
      - name: Wake apps
        env:
          URLS: https://maxima-cis-live.streamlit.app,https://maxima-nse-acopening.streamlit.app
        run: node keep_alive.js
      - name: Ping Supabase (prevent auto-pause)
        env:
          SUPABASE_URL: https://dxmiycgligwwrkpcpblt.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROD_SERVICE_KEY }}
        run: |
          curl -sf -o /dev/null -w "Supabase ping: HTTP %{http_code}\n" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            "$SUPABASE_URL/rest/v1/partners?select=partner_id&limit=1"
